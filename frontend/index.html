<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Medical Evaluator</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>🩺 VR Evaluation Dashboard</h1>
            <p id="student-name">Loading session data...</p>
        </header>

        <div class="grid">
            <!-- Score Card -->
            <div class="card score-card">
                <h2>Total Score</h2>
                <div class="score-circle">
                    <span id="overall-score">--</span>
                </div>
            </div>

            <!-- ABCDE Breakdowns -->
            <div class="card abcde-card">
                <h2>Emergency Scheme (ABCDE)</h2>
                <ul id="abcde-list">
                    <li>Parsing reports...</li>
                </ul>
            </div>

            <!-- Feedback & Errors -->
            <div class="card feedback-card">
                <h2>Feedback Log</h2>
                <ul id="feedback-list">
                    <!-- Javascript will populate this -->
                </ul>
            </div>
            
            <div class="card errors-card">
                <h2>Critical Errors</h2>
                <ul id="errors-list">
                    <!-- Javascript will populate this -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Script to simulate fetching Persona B's JSON data -->
    <script>
        // Person C: Note! Browsers block local file fetching (CORS issues). 
        // For local development, it's easier to mock data here directly,
        // or run a simple python server `python -m http.server 8000`
        const mockReportData = {
            "session_info": { "Modul": "Station", "Dauer": "8:14" },
            "overall_score": 55,
            "abcde_breakdown": {
                "A_Airway": {"status": "Passed", "points_deducted": 0},
                "B_Breathing": {"status": "Missed", "points_deducted": 10},
                "C_Circulation": {"status": "Passed", "points_deducted": 0}
            },
            "feedback": [
                "Airway was checked successfully.",
                "[Time Warning] Monitoring started at 640s. Target is < 600s.",
                "CRITICAL ERROR: Adrenalin cannot be given on the normal ward! (Event at 6:35)"
            ],
            "critical_errors": [
                "MISSING_B_ASSESSMENT",
                "WRONG_MED_CATECHOLAMINE"
            ]
        };

        function renderReport(report) {
            document.getElementById('student-name').innerText = `Session: ${report.session_info.Modul || 'Unknown'} | Time: ${report.session_info.Dauer || 'Unknown'}`;
            document.getElementById('overall-score').innerText = report.overall_score;
            
            // Render ABCDE
            const abcdeHTML = Object.entries(report.abcde_breakdown).map(([key, value]) => `
                <li class="${value.status === 'Passed' ? 'pass' : 'fail'}">
                    <strong>${key}:</strong> ${value.status}
                </li>
            `).join('');
            document.getElementById('abcde-list').innerHTML = abcdeHTML;

            // Render Feedback
            const feedbackHTML = report.feedback.map(text => `<li>${text}</li>`).join('');
            document.getElementById('feedback-list').innerHTML = feedbackHTML;

            // Render Errors
            const errorsHTML = report.critical_errors.map(err => `<li>${err}</li>`).join('');
            document.getElementById('errors-list').innerHTML = errorsHTML;
        }

        // Render mock data to start
        renderReport(mockReportData);
    </script>
</body>
</html>
